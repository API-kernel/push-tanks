<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> <!-- Важно для мобилок -->
    <title>Tank 1990 Online</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>


    <div id="main-layout" style="flex-direction: column;">
        <div id="game-area" style="display: flex; gap: 20px;">
                <!-- ЧАТ (Слева) -->
            <div id="chat-container">
                <div id="chat-toggle-btn" onclick="toggleChatVis()">CHAT</div>
                <div id="chat-window">
                    <div id="chat-messages"></div>
                    <textarea  type="text" id="chat-input" placeholder="Chat here..."  rows="1"></textarea>
                </div>
            </div>

            <!-- ИГРА (Справа) -->
            <div id="game-container">
                <canvas id="gameCanvas"></canvas>
                <canvas id="uiCanvas"></canvas>
                <!-- МЕНЮ -->
                <div id="menu-screen">
                    <h1 class="title">TANK 1990 <br><span style="font-size: 0.5em; color: #a42020;">ONLINE</span></h1>

                    <div class="menu-actions">

                        <!-- НОВОЕ ПОЛЕ ВВОДА -->
                        <div style="margin-bottom: 15px;">
                            <label for="menu-nickname" style="font-size: 12px; color: #aaa; display: block; margin-bottom: 5px;">CALLSIGN</label>
                            <input type="text" id="menu-nickname" maxlength="10" placeholder="NAME">
                        </div>

                        <button onclick="quickPlay()" style="border-color: #63db44; color: #63db44;">QUICK PLAY</button> 
                        <br><br>

                        <button onclick="createRoom()">CREATE ROOM</button>
                    </div>
                </div>

                <!-- ЛОББИ (Ожидание) -->
                <div id="lobby-screen" style="display: none;">
                    <div class="lobby-header">
                        <h2>ROOM: <span id="display-room-id" style="color: #63db44;">???</span></h2>
                        <button class="copy-btn" onclick="copyLink(this)" title="Copy Invite Link">🔗</button>
                        <div class="lobby-close" onclick="backToMenu()">×</div>
                    </div>
                    <!-- БЛОК НАСТРОЕК -->
                    <div class="lobby-settings">
                        <label>
                            MAP:
                            <select id="opt-level-select" onchange="changeSettings()" disabled>
                                <option>Loading...</option>
                            </select>
                        </label>
                        <label>
                            PLAYER LIVES:
                            <input type="number" id="opt-lives" min="0" max="100" value="" onchange="changeSettings()" disabled>
                        </label>
                        <label>
                            MAX ACTIVE TANKS:
                            <input type="number" id="opt-max-active" min="1" max="100" value="" onchange="changeSettings()" disabled>
                        </label>
                        <br>
                        <label>
                            YELLOW BOTS:
                            <input type="number" id="opt-bots-green" min="0" max="50" value="" onchange="changeSettings()" disabled>
                        </label>
                        <label>
                            GREEN BOTS:
                            <input type="number" id="opt-bots-red" min="0" max="100" value="" onchange="changeSettings()" disabled>
                        </label>
                        <label>
                            BOT AI:
                            <select id="opt-bot-ai" onchange="changeSettings()" disabled>
                                <option value="tactical-v5">TACTICAL V5</option>
                                <option value="tactical-v6">TACTICAL V6 (LAB)</option>
                                <option value="tactical-v7">TACTICAL V7 (LAB)</option>
                                <option value="tactical-v2">TACTICAL V2</option>
                                <option value="tactical-v1">TACTICAL V1</option>
                                <option value="legacy">CLASSIC</option>
                            </select>
                        </label>
                        <label>
                            INCLUDE BASES
                            <input type="checkbox" id="opt-bases" onchange="changeSettings()" disabled>
                        </label>
                        <label>
                            AUTO RANDOM MAP
                            <input type="checkbox" id="opt-autonext" onchange="changeSettings()" disabled>
                        </label>
                        <label>
                            VIBRANIUM BASE
                            <input type="checkbox" id="opt-vibranium" onchange="changeSettings()" disabled>
                        </label>
                        <label>
                            ALLOW JOIN IN GAME
                            <input type="checkbox" id="opt-hotjoin" onchange="changeSettings()" disabled>
                        </label>
                    </div>

                    <div id="lobby-players"></div>
                    <button id="btn-start" onclick="startGame()" style="display: none;">START GAME</button>
                </div>
            </div>
        </div>

            <!-- ИНСТРУКЦИЯ -->
        <div id="instructions">
            <div class="instr-col">
                <h3>PLAYER 1</h3>
                <p><span class="key">WASD</span> + <span class="key">GAMEPAD 1</span></p>
                <p><span class="key">SPACE</span> / <span class="key">BTN A</span></p>
            </div>
            <div class="instr-col">
                <h3>PLAYER 2</h3>
                <p><span class="key">ARROWS</span> + <span class="key">GAMEPAD 2</span></p>
                <p><span class="key">ENTER</span> / <span class="key">BTN A</span></p>
            </div>
            <div class="instr-col">
                <h3>SYSTEM</h3>
                <p><span class="key">TAB</span> NAMES</p>
                <p><span class="key">P</span> PAUSE</p>
            </div>
        </div>

        <!-- КНОПКА ДОНАТА (внизу) -->
        <div style="margin-top: 40px;">
            <button class="donate-btn" onclick="toggleDonate(true)">❤️ SUPPORT DEV</button>
        </div>

          <!-- МОДАЛКА ДОНАТА -->
        <div id="donate-modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <span>SERVER FUEL</span> <!-- Заголовок -->
                    <button class="close-btn" onclick="toggleDonate(false)">×</button>
                </div>
                
                <div class="modal-body">
                    <p>
                        DEV NEEDS COFFEE ☕<br>
                        SERVER NEEDS POWER ⚡
                    </p>
                    
                    <div class="qr-placeholder">
                        <img src="assets/qr_code.png" alt="QR Code" style="width: 100%; image-rendering: pixelated;">
                    </div>
                    
                    <p style="font-size: 8px; color: #888;">SCAN VIA BANK APP</p>

                    <a href="https://www.tinkoff.ru/rm/r_rewtwjshrb.PATOkjKOCl/FSS4A72769" target="_blank" class="pay-link">
                        SEND DONATE
                    </a>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="menu-footer">
            <a href="https://github.com/API-kernel/push-tanks" target="_blank" class="footer-link">
                CODE
            </a>
            <span class="separator">|</span>
            <a href="https://t.me/alx_pushkin" target="_blank" class="footer-link">
                CONTACT
            </a>
        </div>
    </div>

    <!-- Кнопка переключения режима Touch -->
    <div id="touch-toggle-btn" onclick="toggleTouchMode()">🎮</div>

    <!-- МОБИЛЬНОЕ УПРАВЛЕНИЕ (Скрыто на ПК через CSS) -->
    <div id="mobile-ui">
        <div id="zone_joystick"></div> <!-- Слева -->
        <div id="btn_fire">🔥</div>    <!-- Справа -->
        <button id="btn_fullscreen" onclick="toggleFullScreen()">⛶</button>
    </div>

    <script src="src/mobile.js"></script>
    <script src="src/menu.js"></script>
    <script type="module" src="src/game.js"></script>
</body>
</html>
